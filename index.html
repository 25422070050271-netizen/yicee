html,body{background:#ffffff;color:#000}
.brand-chrome{font-family:'Cormorant Garamond',Georgia,'Times New Roman',serif;font-style:italic;font-weight:300;letter-spacing:.01em;background:linear-gradient(180deg,#ffffff 0%,#e4e4e7 28%,#71717a 47%,#fafafa 52%,#a1a1aa 74%,#3f3f46 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.y2k-card{border:2px solid #000;border-radius:24px;background:#fff;box-shadow:4px 4px 0 #000}
.y2k-btn{border:2px solid #000;border-radius:24px;background:#fff;color:#000;box-shadow:4px 4px 0 #000;font-weight:800;transition:transform .08s ease,box-shadow .08s ease;cursor:pointer}
.y2k-btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 #000}
.y2k-btn-dark{background:#000;color:#fff}
.y2k-iconbtn{display:inline-flex;align-items:center;justify-content:center;height:44px;width:44px;flex:none;border:2px solid #000;border-radius:16px;background:#fff;color:#000;box-shadow:3px 3px 0 #000;transition:transform .08s ease,box-shadow .08s ease;cursor:pointer}
.y2k-iconbtn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #000}
.y2k-roundbtn{display:inline-flex;align-items:center;justify-content:center;height:44px;width:44px;flex:none;border:2px solid #000;border-radius:9999px;background:#fff;color:#000;box-shadow:3px 3px 0 #000;transition:transform .08s ease,box-shadow .08s ease;cursor:pointer}
.y2k-roundbtn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #000}
.avatar-ring{display:inline-flex;align-items:center;justify-content:center;flex:none;overflow:hidden;border:2px solid #000;border-radius:9999px;background:#e4e4e7;color:#000;font-weight:900}
.avatar-ring img{height:100%;width:100%;object-fit:cover}
.y2k-input{width:100%;border:2px solid #000;border-radius:16px;background:#fff;padding:12px 16px;color:#000;outline:none;transition:box-shadow .12s ease}
.y2k-input:focus{box-shadow:3px 3px 0 #000}
.y2k-chip{border:2px solid #000;border-radius:999px;background:#fff;color:#000;box-shadow:3px 3px 0 #000;font-weight:800;transition:transform .08s ease,box-shadow .08s ease;cursor:pointer}
.y2k-chip:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #000}
.y2k-chip-on{background:#000;color:#fff}
.hr-dotted{border-top:2px dotted #000}
.dot-grid{background-image:radial-gradient(rgba(0,0,0,.10) 1px,transparent 1.4px);background-size:26px 26px}
.marquee{overflow:hidden;border-top:2px solid #000;border-bottom:2px solid #000;background:#000;color:#fff}
.marquee-inner{display:inline-block;white-space:nowrap;animation:marq 22s linear infinite;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;font-weight:700;letter-spacing:.25em;padding:8px 0}
@keyframes marq{to{transform:translateX(-50%)}}
@keyframes ringpulse{0%{transform:scale(.9);opacity:.6}100%{transform:scale(1.7);opacity:0}}
.ring-pulse{animation:ringpulse 1.6s ease-out infinite}
@keyframes recpulse{0%,100%{opacity:1}50%{opacity:.35}}
.rec-pulse{animation:recpulse 1.2s ease-in-out infinite}
